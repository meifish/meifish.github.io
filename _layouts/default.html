<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">⚗️ {{ site.title }}</a>
    <nav><a href="{{ '/subscribe/' | relative_url }}">Subscribe</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a></nav>
  </header>
  {{ content }}
  <footer class="site">
    <p>{{ site.title }} by {{ site.author }}. Every skill is tested in a fresh, isolated sandbox so they can't mess with each other.</p>
  </footer>
</div>
</body>
</html>
